name: Déploiement FTPS

# Déploiement par FTPS explicite (AUTH TLS sur le port 21).
#
# Pourquoi ni SSH ni l'API cPanel : les ports 22, 2222, 7822 et 21098 sont
# fermés, et Heberjahiz place une page de défi anti-bot (openresty, « One
# moment, please... ») devant le port 2083, qui renvoie du HTML au lieu du JSON.
#
# Connexion à serveur133.heberjahiz.com et non à ftp.amineelkhal.com : le
# certificat Let's Encrypt du serveur est émis pour ce nom, ce qui permet de
# vérifier le certificat strictement au lieu de désactiver le contrôle.
#
# Les étapes sont volontairement fines : les logs demandent une authentification
# même sur un dépôt public, alors que la liste des étapes est publique. Le nom
# de l'étape en échec suffit donc à diagnostiquer.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-ftps
  cancel-in-progress: false

env:
  FTP_HOST: serveur133.heberjahiz.com
  REMOTE: public_html

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Controle du secret FTP_USER
        run: |
          if [ -z "${FTP_USER:-}" ]; then
            echo "::error::Le secret FTP_USER est vide ou inexistant."
            echo "Settings -> Secrets and variables -> Actions -> onglet SECRETS."
            exit 1
          fi
          echo "FTP_USER present (${#FTP_USER} caracteres)."

      - name: Controle du secret FTP_PASSWORD
        run: |
          if [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::Le secret FTP_PASSWORD est vide ou inexistant."
            exit 1
          fi
          echo "FTP_PASSWORD present (${#FTP_PASSWORD} caracteres)."

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Joignabilite du port 21 depuis le runner
        run: |
          set +e
          curl -sS --max-time 20 --connect-timeout 10 -o /dev/null "ftp://$FTP_HOST/"
          code=$?
          set -e
          echo "curl exit=$code"
          case $code in
            7)  echo "::error::Port 21 injoignable depuis GitHub Actions : l'hebergeur"
                echo "filtre les IP des runners. Le deploiement doit alors partir"
                echo "d'une IP autorisee, avec deploy.ps1 en local."
                exit 1 ;;
            67) echo "Port 21 joignable : login anonyme refuse, ce qui est attendu." ;;
            0)  echo "Port 21 joignable." ;;
            *)  echo "::warning::Code curl inattendu ($code), on continue." ;;
          esac

      - name: Ouverture de session FTPS
        run: |
          set -uo pipefail
          umask 077
          : > "$HOME/.netrc"
          echo "machine $FTP_HOST login $FTP_USER password $FTP_PASSWORD" > "$HOME/.netrc"

          # Login puis pwd : aucun canal de donnees n'est ouvert ici. Un echec
          # designe donc les identifiants ou le certificat, rien d'autre.
          lftp -f /dev/stdin <<LFTP
          set ftp:ssl-force true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 1
          set net:timeout 20
          set cmd:fail-exit true
          open ftp://$FTP_HOST
          pwd
          bye
          LFTP
          rc=$?
          rm -f "$HOME/.netrc"
          if [ $rc -ne 0 ]; then
            echo "::error::Session refusee (code $rc) : mot de passe errone dans le"
            echo "secret FTP_PASSWORD, compte desactive, ou certificat rejete."
            exit $rc
          fi

      - name: Listage du repertoire (canal de donnees)
        run: |
          set -uo pipefail
          umask 077
          echo "machine $FTP_HOST login $FTP_USER password $FTP_PASSWORD" > "$HOME/.netrc"

          # cls ouvre un canal de donnees en mode passif, sur un port haut. Si la
          # session passe mais que ceci echoue, ce sont les ports passifs qui sont
          # filtres. Le pwd revele aussi la racine du compte, ce qui dira si le
          # prefixe public_html est le bon.
          lftp -f /dev/stdin <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 1
          set net:timeout 20
          set cmd:fail-exit true
          open ftp://$FTP_HOST
          pwd
          cls -1
          bye
          LFTP
          rc=$?
          rm -f "$HOME/.netrc"
          if [ $rc -ne 0 ]; then
            echo "::error::Canal de donnees bloque (code $rc) : les ports passifs"
            echo "sont filtres entre GitHub Actions et l'hebergeur."
            exit $rc
          fi

      - name: Envoi des fichiers
        run: |
          set -uo pipefail
          umask 077
          echo "machine $FTP_HOST login $FTP_USER password $FTP_PASSWORD" > "$HOME/.netrc"

          lftp -f /dev/stdin <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 25
          set cmd:fail-exit true
          open ftp://$FTP_HOST
          mkdir -f $REMOTE/css
          mkdir -f $REMOTE/js
          mkdir -f $REMOTE/lang
          mkdir -f $REMOTE/icons
          put -O $REMOTE index.php mailer.php .htaccess robots.txt sitemap.xml manifest.json humans.txt
          put -O $REMOTE _inc_lang.php _inc_about.php _inc_career.php _inc_footer.php
          put -O $REMOTE _inc_loader.php _inc_nav.php _inc_nav_mobile.php _inc_platforms.php
          put -O $REMOTE _inc_shapes.php _inc_some_shapes.php _inc_stats.php
          put -O $REMOTE/css css/sections.css css/application.css css/index.css
          put -O $REMOTE/js js/application.js
          put -O $REMOTE/lang lang/fr.php lang/en.php
          put -O $REMOTE/icons icons/og-fr.png icons/og-en.png
          bye
          LFTP
          rc=$?
          rm -f "$HOME/.netrc"
          [ $rc -eq 0 ] || { echo "::error::Echec de l'envoi (code $rc)"; exit $rc; }

      - name: Suppression des fichiers retirés du site
        run: |
          set -uo pipefail
          umask 077
          echo "machine $FTP_HOST login $FTP_USER password $FTP_PASSWORD" > "$HOME/.netrc"

          # Pas de fail-exit ici : un fichier deja absent est un cas normal.
          lftp -f /dev/stdin <<LFTP
          set ftp:ssl-force true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          open ftp://$FTP_HOST
          rm -f $REMOTE/indexold.html
          rm -f $REMOTE/_inc_works.php
          rm -f $REMOTE/_inc_experiments.php
          rm -f $REMOTE/_inc_projects.php
          bye
          LFTP
          rm -f "$HOME/.netrc"
          echo "Nettoyage termine."

      - name: Vérification du site en ligne
        run: |
          set -uo pipefail
          echec=0
          verifier() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.amineelkhal.com$1?cb=$RANDOM")
            if [ "$code" = "$2" ]; then
              printf '  ok    %-22s %s\n' "$1" "$code"
            else
              printf '  ECHEC %-22s attendu %s, obtenu %s\n' "$1" "$2" "$code"
              echec=1
            fi
          }

          echo "== Doivent exister =="
          verifier "/"                  200
          verifier "/en/"               200
          verifier "/robots.txt"        200
          verifier "/sitemap.xml"       200
          verifier "/css/sections.css"  200
          verifier "/icons/og-fr.png"   200

          echo "== Doivent avoir disparu =="
          verifier "/indexold.html"     404
          verifier "/_inc_works.php"    404

          echo "== Contenu servi =="
          page=$(curl -s "https://www.amineelkhal.com/?cb=$RANDOM")
          for motif in stats-band platforms-section career-section 'og:image' 'application/ld+json'; do
            if printf '%s' "$page" | grep -q "$motif"; then
              printf '  ok    %s\n' "$motif"
            else
              printf '  ECHEC %s absent de la page servie\n' "$motif"
              echec=1
            fi
          done

          exit $echec
