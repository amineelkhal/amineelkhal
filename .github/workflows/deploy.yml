name: Déploiement cPanel

# Chaque push sur main déclenche le déploiement cPanel, qui exécute les tâches
# décrites dans .cpanel.yml (copie vers public_html + suppression des fichiers
# retirés). Lançable aussi à la main depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : deux push rapprochés ne se marchent pas dessus.
concurrency:
  group: deploiement-cpanel
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: serveur133.heberjahiz.com
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}

    steps:
      - name: Lister les dépôts Git connus de cPanel
        id: depots
        run: |
          set -uo pipefail

          if [ -z "${CPANEL_USER:-}" ] || [ -z "${CPANEL_TOKEN:-}" ]; then
            echo "::error::Les secrets CPANEL_USER et CPANEL_TOKEN ne sont pas définis."
            exit 1
          fi

          # -G + --data-urlencode : encodage correct des paramètres, sans bricolage.
          http=$(curl --silent --show-error --max-time 60 \
                      --output /tmp/repos.json --write-out '%{http_code}' \
                      --header "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                      "https://${CPANEL_HOST}:2083/execute/VersionControl/retrieve")

          echo "HTTP $http"
          echo "--- réponse cPanel ---"
          cat /tmp/repos.json
          echo
          echo "----------------------"

          if [ "$http" != "200" ]; then
            echo "::error::cPanel a répondu HTTP $http. Jeton invalide ou API inaccessible."
            exit 1
          fi

          if [ "$(jq -r '.errors' /tmp/repos.json)" != "null" ]; then
            echo "::error::cPanel a renvoyé une erreur : $(jq -c '.errors' /tmp/repos.json)"
            exit 1
          fi

          nb=$(jq -r '.data | length' /tmp/repos.json)
          echo "Dépôts trouvés : $nb"
          jq -r '.data[] | "  \(.name)  ->  \(.repository_root)"' /tmp/repos.json

          if [ "$nb" = "0" ]; then
            echo "::error::cPanel ne connaît aucun dépôt Git. Crée-le dans Git Version Control."
            exit 1
          fi

          # On prend le dépôt nommé amineelkhal, sinon le premier de la liste.
          root=$(jq -r '[.data[] | select(.name == "amineelkhal")][0].repository_root // .data[0].repository_root' /tmp/repos.json)
          echo "Chemin retenu : $root"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Déclencher le déploiement
        run: |
          set -uo pipefail
          root='${{ steps.depots.outputs.root }}'
          echo "Déploiement de : $root"

          http=$(curl --silent --show-error --max-time 120 -G \
                      --output /tmp/deploy.json --write-out '%{http_code}' \
                      --header "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                      --data-urlencode "repository_root=$root" \
                      "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create")

          echo "HTTP $http"
          echo "--- réponse cPanel ---"
          cat /tmp/deploy.json
          echo
          echo "----------------------"

          # UAPI renvoie HTTP 200 même en cas d'échec : le verdict est dans le JSON.
          if [ "$(jq -r '.errors' /tmp/deploy.json)" != "null" ]; then
            echo "::error::cPanel a refusé : $(jq -c '.errors' /tmp/deploy.json)"
            exit 1
          fi
          echo "Déploiement mis en file d'attente."

      - name: Vérifier le site en ligne
        # Le déploiement cPanel est asynchrone : on laisse aux tâches de
        # .cpanel.yml le temps de s'exécuter avant de contrôler le résultat.
        run: |
          set -uo pipefail
          echo "Attente de 45 s..."
          sleep 45

          echec=0
          verifier() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.amineelkhal.com$1?cb=$RANDOM")
            if [ "$code" = "$2" ]; then
              printf '  ok    %-22s %s\n' "$1" "$code"
            else
              printf '  ECHEC %-22s attendu %s, obtenu %s\n' "$1" "$2" "$code"
              echec=1
            fi
          }

          echo "== Doivent exister =="
          verifier "/"                  200
          verifier "/en/"               200
          verifier "/robots.txt"        200
          verifier "/sitemap.xml"       200
          verifier "/css/sections.css"  200
          verifier "/icons/og-fr.png"   200

          echo "== Doivent avoir disparu =="
          verifier "/indexold.html"     404
          verifier "/_inc_works.php"    404

          echo "== Contenu servi =="
          if curl -s "https://www.amineelkhal.com/?cb=$RANDOM" | grep -q 'stats-band'; then
            echo "  ok    les nouvelles sections sont en ligne"
          else
            echo "  ECHEC la page servie ne contient pas les nouvelles sections"
            echec=1
          fi

          exit $echec
