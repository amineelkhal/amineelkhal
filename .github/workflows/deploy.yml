name: Déploiement FTPS

# Déploiement direct par FTPS explicite (AUTH TLS sur le port 21).
#
# Pourquoi pas l'API cPanel : Heberjahiz place une page de défi anti-bot
# (openresty, « One moment, please... ») devant le port 2083. Tout client non
# navigateur reçoit du HTML au lieu du JSON, l'API est donc inutilisable ici.
# Pourquoi pas SSH : les ports 22, 2222, 7822 et 21098 sont tous fermés.
#
# Le certificat du serveur est un Let's Encrypt émis pour
# serveur133.heberjahiz.com — d'où la connexion à ce nom plutôt qu'à
# ftp.amineelkhal.com, ce qui permet de vérifier le certificat strictement.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-ftps
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: serveur133.heberjahiz.com
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      REMOTE: public_html

    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer les fichiers
        run: |
          set -uo pipefail

          if [ -z "${FTP_USER:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::Identifiants absents des SECRETS du depot."
            echo ""
            echo "Settings -> Secrets and variables -> Actions -> onglet SECRETS"
            echo "  -> New repository secret :  FTP_USER  et  FTP_PASSWORD"
            echo ""
            echo "Attention : l'onglet VARIABLES, juste a cote, ne convient pas."
            echo "Une variable n'est pas masquee dans les logs, et les logs d'un"
            echo "depot public sont lisibles par tout le monde. Un mot de passe"
            echo "place la doit etre considere comme divulgue et change."
            exit 1
          fi

          # Identifiants dans un .netrc en 600 : jamais en argument de commande,
          # donc invisibles dans la liste des processus du runner.
          umask 077
          printf 'machine %s login %s password %s\n' \
                 "$FTP_HOST" "$FTP_USER" "$FTP_PASSWORD" > "$HOME/.netrc"

          lftp -f /dev/stdin <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 25
          set cmd:fail-exit true

          open ftp://$FTP_HOST

          mkdir -f $REMOTE/css
          mkdir -f $REMOTE/js
          mkdir -f $REMOTE/lang
          mkdir -f $REMOTE/icons

          put -O $REMOTE index.php mailer.php .htaccess robots.txt sitemap.xml manifest.json humans.txt
          put -O $REMOTE _inc_lang.php _inc_about.php _inc_career.php _inc_footer.php
          put -O $REMOTE _inc_loader.php _inc_nav.php _inc_nav_mobile.php _inc_platforms.php
          put -O $REMOTE _inc_shapes.php _inc_some_shapes.php _inc_stats.php
          put -O $REMOTE/css css/sections.css css/application.css css/index.css
          put -O $REMOTE/js js/application.js
          put -O $REMOTE/lang lang/fr.php lang/en.php
          put -O $REMOTE/icons icons/og-fr.png icons/og-en.png

          bye
          LFTP
          rc=$?

          shred -u "$HOME/.netrc" 2>/dev/null || rm -f "$HOME/.netrc"
          [ $rc -eq 0 ] || { echo "::error::Echec de l'envoi FTPS (code $rc)"; exit $rc; }
          echo "Fichiers envoyes."

      - name: Supprimer les fichiers retirés du site
        run: |
          set -uo pipefail
          umask 077
          printf 'machine %s login %s password %s\n' \
                 "$FTP_HOST" "$FTP_USER" "$FTP_PASSWORD" > "$HOME/.netrc"

          # cmd:fail-exit reste à false ici : un fichier déjà absent ne doit pas
          # faire échouer le déploiement.
          lftp -f /dev/stdin <<LFTP
          set ftp:ssl-force true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          open ftp://$FTP_HOST
          rm -f $REMOTE/indexold.html
          rm -f $REMOTE/_inc_works.php
          rm -f $REMOTE/_inc_experiments.php
          rm -f $REMOTE/_inc_projects.php
          bye
          LFTP

          shred -u "$HOME/.netrc" 2>/dev/null || rm -f "$HOME/.netrc"
          echo "Nettoyage termine."

      - name: Vérifier le site en ligne
        run: |
          set -uo pipefail
          echec=0
          verifier() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.amineelkhal.com$1?cb=$RANDOM")
            if [ "$code" = "$2" ]; then
              printf '  ok    %-22s %s\n' "$1" "$code"
            else
              printf '  ECHEC %-22s attendu %s, obtenu %s\n' "$1" "$2" "$code"
              echec=1
            fi
          }

          echo "== Doivent exister =="
          verifier "/"                  200
          verifier "/en/"               200
          verifier "/robots.txt"        200
          verifier "/sitemap.xml"       200
          verifier "/css/sections.css"  200
          verifier "/icons/og-fr.png"   200

          echo "== Doivent avoir disparu =="
          verifier "/indexold.html"     404
          verifier "/_inc_works.php"    404

          echo "== Contenu servi =="
          page=$(curl -s "https://www.amineelkhal.com/?cb=$RANDOM")
          for motif in stats-band platforms-section career-section 'og:image' 'application/ld+json'; do
            if printf '%s' "$page" | grep -q "$motif"; then
              printf '  ok    %s\n' "$motif"
            else
              printf '  ECHEC %s absent de la page servie\n' "$motif"
              echec=1
            fi
          done

          exit $echec
